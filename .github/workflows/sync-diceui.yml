name: Sync diceui

# Opens or refreshes a PR when the diceui registry's Presentation components
# differ from the local copies. PRs opened with the workflow token don't
# trigger other workflows, so Code check is dispatched on the branch.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}

env:
  FORCE_COLOR: 3
  BRANCH: sync/diceui

jobs:
  sync:
    runs-on: ubuntu-latest
    name: Sync
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/setup

      - name: Sync from the diceui registry
        id: sync
        run: |
          pnpm ui:sync
          if [ -n "$(git status --porcelain packages/ui)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or refresh the PR
        if: steps.sync.outputs.changed == 'true'
        run: |
          # A branch with commits from anyone but the bot has work on it.
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            git fetch --quiet origin "$BRANCH"
            if git log "origin/main..origin/$BRANCH" --format=%ae | grep -qv "$BOT_EMAIL"; then
              echo "::notice::$BRANCH has commits from someone else, so it was left alone."
              exit 0
            fi
          fi

          # The registry serves what diceui.com last deployed, so this lists
          # the diceui commits since the copies last changed here.
          since=$(git log -1 --format=%cI -- packages/ui/src/components/presentation.tsx packages/ui/src/components/presentation-zoom-select.tsx)
          for file in docs/registry/bases/base/ui/presentation.tsx docs/registry/bases/base/components/presentation-zoom-select.tsx; do
            gh api "repos/sadmann7/diceui/commits?path=$file&since=$since" \
              --jq '.[] | "\(.commit.committer.date)\t\(.commit.message | split("\n")[0]) sadmann7/diceui@\(.sha[0:7])"'
          done | sort -u | cut -f2 > "$RUNNER_TEMP/commits.txt"

          {
            echo "Brings the Presentation components up to the diceui registry."
            echo
            git status --porcelain packages/ui | awk '{ print "- Synced `" $2 "`" }'
            if [ -s "$RUNNER_TEMP/commits.txt" ]; then
              echo
              echo "**Commits from diceui**"
              echo
              sed 's/^/- /' "$RUNNER_TEMP/commits.txt"
            fi
            if grep -q '!:' "$RUNNER_TEMP/commits.txt"; then
              echo
              echo "**Breaking**: the docs editor and examples may need updating for these."
              echo
              grep '!:' "$RUNNER_TEMP/commits.txt" | sed 's/^/- /'
            fi
          } > "$RUNNER_TEMP/body.md"

          git config user.name "github-actions[bot]"
          git config user.email "$BOT_EMAIL"
          git switch --create "$BRANCH"
          git add packages/ui
          git commit --quiet --message "$TITLE"
          git push --force origin "$BRANCH"

          if [ "$(gh pr view "$BRANCH" --json state --jq .state 2> /dev/null)" = "OPEN" ]; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          fi
          gh workflow run code-check.yml --ref "$BRANCH"
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "chore(ui): sync the presentation components from diceui"
          BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
