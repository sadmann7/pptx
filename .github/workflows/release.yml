name: Release

on:
  push:
    branches:
      - main

env:
  FORCE_COLOR: 3
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - uses: ./.github/setup

      - name: Build packages
        run: pnpm turbo build --filter=!docs

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v1.4.1
        with:
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
          # Trusted publishing (OIDC) is configured on npm, so NPM_TOKEN is not needed.
          # Provenance is attached automatically, but only once this repo is public.
          # Forcing it while private fails the publish with E422.
