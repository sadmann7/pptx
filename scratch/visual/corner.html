<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        background: #efe9d9;
      }
      .stage {
        position: absolute;
        left: 0;
        top: 0;
        width: 1280px;
        height: 720px;
        transform: scale(0.953125);
        transform-origin: 0 0;
      }
      .frame {
        position: absolute;
        left: 78.13px;
        top: 249.7px;
        width: 1122.14px;
        height: 350.05px;
      }
      table {
        width: 100%;
        height: 100%;
        table-layout: fixed;
        border-collapse: separate;
        border-spacing: 0;
      }
      td {
        box-sizing: border-box;
        padding: 4px 8px;
        color: #efe9d9;
        font: 12px monospace;
        background: #0f0f0f;
      }
      /* variant A: cells own every edge (current renderer behaviour) */
      .a td {
        border-top: 1px solid #000;
        border-bottom: 1px solid #000;
      }
      .a td:not(:last-child) {
        border-right: 1px solid #000;
      }
      .a td:first-child {
        border-left: 1px solid #000;
      }
      .a td:last-child {
        border-right: 1px solid #000;
      }
      /* variant B: outer ring on the table, cells own interior edges only */
      .b {
        border: 1px solid #000;
      }
      .b td:not(:last-child) {
        border-right: 1px solid #000;
      }
      .b tr:not(:last-child) td {
        border-bottom: 1px solid #000;
      }
      /* variant C: vertical edges as inset shadows (clipped to the padding box) */
      .c td {
        border-top: 1px solid #000;
        border-bottom: 1px solid #000;
      }
      .c td:not(:last-child) {
        box-shadow: inset -1px 0 0 0 #000;
      }
      .c td:first-child {
        box-shadow: inset 1px 0 0 0 #000;
      }
      .c td:not(:first-child):not(:last-child) {
        box-shadow: inset -1px 0 0 0 #000;
      }
      .c td:last-child {
        box-shadow: inset -1px 0 0 0 #000;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="frame">
        <table id="t"></table>
      </div>
    </div>
    <script>
      const variant = new URLSearchParams(location.search).get("v") ?? "a";
      const t = document.getElementById("t");
      t.className = variant;
      const rows = [
        "Phase|Minutes|Output|Decision",
        "Collect|15|12 references|Keep 4",
        "Collide|25|8 combinations|Keep 3",
        "Distort|30|5 directions|Keep 2",
        "Ship|20|1 prototype|Commit",
      ];
      t.innerHTML = rows
        .map(
          (r, i) =>
            `<tr style="height:20%">${r
              .split("|")
              .map(
                (c) =>
                  `<td style="background:${i === 0 ? "#0f0f0f" : i % 2 ? "#efe9d9" : "#e4dcc6"};color:${i === 0 ? "#efe9d9" : "#0f0f0f"}">${c}</td>`,
              )
              .join("")}</tr>`,
        )
        .join("");
      document.title = "ready";
    </script>
  </body>
</html>
